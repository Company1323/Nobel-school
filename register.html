
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت اطلاعات دانش‌آموز | نوبل</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f2f6f5;
            font-family: Vazirmatn, sans-serif;
        }

        .register-box {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 10px 40px #01393912;
        }

        h2 {
            color: #013939;
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            color: #777;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #dce5e2;
            border-radius: 11px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #087c70;
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 25px;
            border: none;
            border-radius: 11px;
            background: #013939;
            color: white;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-box">
    <h2>ثبت اطلاعات دانش‌آموز</h2>
    <p class="subtitle">سامانه دانش‌آموزی مدرسه نوبل</p>

    <form id="registerForm">

        <label for="fullName">نام و نام خانوادگی</label>
        <input
            type="text"
            id="fullName"
            maxlength="80"
            placeholder="مثلاً علی رضایی"
            required
        >

        <label for="className">کلاس</label>
        <select id="className" required>
            <option value="">انتخاب کلاس</option>
            <option value="نهم ۱">نهم ۱</option>
            <option value="نهم ۲">نهم ۲</option>
            <option value="نهم ۳">نهم ۳</option>
            <option value="نهم ۴">نهم ۴</option>
        </select>

<label for="nationalCode">کد ملی</label>
<input
    type="text"
    id="nationalCode"
    maxlength="10"
    inputmode="numeric"
    placeholder="کد ملی ۱۰ رقمی"
    autocomplete="off"
    required
>

        <button type="submit" id="submitBtn">ثبت اطلاعات</button>

        <div id="message" role="status"></div>

    </form>
</div>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxs7xziIEG9C1fucHbI3eGex2Tu-XWZCW5yljRe-KOOjyGIPZ8goQb-1enMMGtjk7bi/exec";

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const fullName =
        document.getElementById("fullName").value.trim();

    const className =
        document.getElementById("className").value;

    const nationalCode =
        document.getElementById("nationalCode").value.trim();

    if (!fullName || !className || !/^\d{10}$/.test(nationalCode)) {
        message.textContent = "نام، کلاس یا کد ملی معتبر نیست.";
        return;
    }

    button.disabled = true;
    message.textContent = "در حال ارسال درخواست...";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                fullName,
                className,
                nationalCode
            })
        });

        message.textContent =
            "ثبت شد!";

        form.reset();

    } catch (error) {
        message.textContent = "ارسال اطلاعات انجام نشد.";
    } finally {
        button.disabled = false;
    }
});

</script>

</body>
</html>
